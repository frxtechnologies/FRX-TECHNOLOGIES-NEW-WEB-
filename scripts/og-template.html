<!doctype html>
<!--
  Template for public/brand/og.jpg (1200×630). Rendered with headless Chrome so the
  approved typefaces (local Bricolage Grotesque + Inter Tight) and the real full FRX logo
  are used exactly. Re-render with scripts/render-og.mjs after editing.
-->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Bricolage";
    src: url("../src/design-system/fonts/BricolageGrotesque-Variable-latin.woff2") format("woff2");
    font-weight: 200 800;
    font-stretch: 75% 100%;
  }
  @font-face {
    font-family: "InterTight";
    src: url("../src/design-system/fonts/InterTight-Variable-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f4f2ed;
    color: #0a0a0c;
    font-family: "InterTight", sans-serif;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(10,10,12,.13) 1.4px, transparent 1.8px);
    background-size: 26px 26px;
  }
  /* the slanted blue field, echoing the angle of the logo's X */
  .slab {
    position: absolute; right: -120px; top: -40px; width: 560px; height: 760px;
    background: linear-gradient(160deg, #0433a8, #045cec 55%, #008cff);
    transform: skewX(-14deg);
  }
  .slab2 {
    position: absolute; right: 360px; top: -40px; width: 70px; height: 760px;
    background: #ffe98f;
    transform: skewX(-14deg);
  }
  .disc {
    position: absolute; right: 150px; top: 120px; width: 300px; height: 300px; border-radius: 50%;
    background: #ffe98f; opacity: .95;
  }
  .logoWrap {
    position: absolute; right: 70px; top: 150px; width: 430px; padding: 26px 34px;
    background: #fff; border: 4px solid #0a0a0c; border-radius: 22px;
    box-shadow: 14px 14px 0 #ffe98f;
  }
  .logoWrap img { width: 100%; display: block; }
  h1 {
    position: absolute; left: 64px; top: 74px;
    font-family: "Bricolage", sans-serif; font-weight: 800; font-stretch: 75%;
    font-size: 150px; line-height: .82; letter-spacing: -.006em; text-transform: uppercase;
  }
  h1 span { display: block; position: relative; }
  h1 .scale::before {
    content: ""; position: absolute; left: -10px; right: -16px; bottom: 6px; height: 46px;
    background: #ffe98f; transform: skewX(-9deg); z-index: -1;
  }
  .tag {
    position: absolute; left: 64px; bottom: 74px; width: 640px;
    font-size: 27px; line-height: 1.32; font-weight: 500; color: #34343a;
  }
  .url {
    position: absolute; left: 64px; bottom: 30px;
    font-size: 19px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #045cec;
  }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg,#045cec,#ffe98f); }
</style>
<div class="dots"></div>
<div class="slab"></div>
<div class="slab2"></div>
<div class="disc"></div>
<div class="logoWrap"><img src="../public/brand/frx-logo-light-mode.png" alt="FRX Technologies" /></div>
<h1><span>Build.</span><span>Automate.</span><span class="scale">Scale.</span></h1>
<p class="tag">Custom software, AI automation, web &amp; mobile experiences and digital products.</p>
<p class="url">frxtechnologies.com</p>
<div class="bar"></div>
